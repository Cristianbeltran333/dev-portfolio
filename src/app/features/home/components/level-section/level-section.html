<section class="level-section" [ngClass]="themeClass" [id]="themeClass">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">{{ title }}</h2>
      <p class="section-subtitle">{{ subtitle }}</p>
    </div>
    
    <div class="projects-grid" *ngIf="projects.length > 0; else noProjects">
      <app-project-card *ngFor="let project of projects" [project]="project"></app-project-card>
    </div>
    
    <ng-template #noProjects>
      <div class="empty-state">
        <div class="empty-icon">🚀</div>
        <h3>Próximamente</h3>
        <p>Aún no hay retos completados en este nivel. ¡Vuelve pronto!</p>
      </div>
    </ng-template>
  </div>
</section>
